<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RPG Fitness</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/rpg.css">
</head>
<body>
  <div id="app">
    <header id="stat-header" class="hidden">
      <div id="stat-header-top">
        <span id="hdr-name-level">NAME  Lv1</span>
        <span id="hdr-stats">STR:1 AGI:1 VIT:1</span>
        <span id="hdr-tier" class="hdr-tier">M</span>
      </div>
      <div id="stat-header-hp">
        <span id="hdr-hp-label">❤️</span>
        <div id="hdr-hp-track" class="progress-track">
          <div id="hdr-hp-fill" class="progress-fill progress-fill-red"></div>
        </div>
        <span id="hdr-hp-text">100/115</span>
        <span id="hdr-hp-next" class="hdr-countdown">⏳—</span>
      </div>
      <div id="stat-header-energy">
        <span id="hdr-energy-label">⚡</span>
        <div id="hdr-energy-track" class="progress-track">
          <div id="hdr-energy-fill" class="progress-fill energy-fill"></div>
        </div>
        <span id="hdr-energy-text">35/35</span>
      </div>
      <div id="stat-header-fed-row">
        <span id="hdr-stat-next" class="hdr-countdown">⏳ stat —</span>
        <span id="hdr-fed" class="hdr-fed">🍽 Not yet fed</span>
      </div>
    </header>

    <main id="screen-container"></main>

    <nav id="bottom-nav" class="hidden">
      <button class="nav-btn" data-route="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-btn" data-route="log">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Log</span>
      </button>
      <button class="nav-btn" data-route="quests">
        <span class="nav-icon">📜</span>
        <span class="nav-label">Quests</span>
      </button>
      <button class="nav-btn" data-route="battles">
        <span class="nav-icon">⚔️</span>
        <span class="nav-label">Battles</span>
      </button>
      <button class="nav-btn" data-route="character">
        <span class="nav-icon">🛡️</span>
        <span class="nav-label">Hero</span>
      </button>
    </nav>

    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true">
      <div id="modal-box">
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ranks.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/log.js"></script>
  <script src="js/ui/questsScreen.js"></script>
  <script src="js/ui/character.js"></script>
  <script src="js/ui/combat.js"></script>
  <script src="js/ui/history.js"></script>
  <script src="js/ui/schedule.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/mealLibrary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
